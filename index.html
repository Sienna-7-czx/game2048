<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<title>2048 小游戏</title>
<style>
  :root {
    --bg: #faf8ef;
    --board-bg: #bbada0;
    --cell-bg: rgba(238, 228, 218, 0.35);
    --text: #776e65;
    --text-light: #f9f6f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  .wrap {
    width: 100%;
    max-width: 500px;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  .title { font-size: 34px; font-weight: 900; letter-spacing: 1px; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: #bbada0; color: #fff; border-radius: 8px;
    padding: 6px 14px; min-width: 76px; text-align: center;
    display: flex; flex-direction: column;
  }
  .score-box .label { font-size: 11px; opacity: .85; letter-spacing: 1px; }
  .score-box .val { font-size: 22px; font-weight: 700; line-height: 1.15; }
  .score-box.best { background: #8f7a66; }
  .sub { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
  .hint { opacity: .8; }
  .btn {
    border: 0; background: #8f7a66; color: #f9f6f2; font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 8px; cursor: pointer;
  }
  .btn:active { opacity: .8; }
  .board-wrap {
    position: relative; background: var(--board-bg);
    border-radius: 10px; padding: 12px; touch-action: none;
  }
  .grid { position: relative; width: 100%; aspect-ratio: 1 / 1; }
  .cell {
    position: absolute; top: 0; left: 0; background: var(--cell-bg); border-radius: 8px;
  }
  .tile {
    position: absolute; top: 0; left: 0; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: var(--text); z-index: 2;
    transform: translate(var(--tx, 0), var(--ty, 0));
    transition: transform .12s ease-in-out;
    will-change: transform;
  }
  .tile.no-anim { transition: none; }
  .tile.new { animation: pop .2s ease; }
  .tile.merged { animation: pop .2s ease; }
  @keyframes pop {
    0%   { transform: translate(var(--tx, 0), var(--ty, 0)) scale(0); }
    70%  { transform: translate(var(--tx, 0), var(--ty, 0)) scale(1.18); }
    100% { transform: translate(var(--tx, 0), var(--ty, 0)) scale(1); }
  }
  .overlay {
    position: absolute; inset: 0; border-radius: 10px;
    background: rgba(238, 228, 218, 0.73);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 5; text-align: center;
  }
  .overlay .msg { font-size: 32px; font-weight: 900; }
  .overlay .sub-msg { font-size: 15px; opacity: .85; }
  .overlay .btn { font-size: 16px; padding: 11px 22px; }
  .hidden { display: none !important; }

  .t2 { background: #eee4da; }
  .t4 { background: #ede0c8; }
  .t8 { background: #f2b179; color: var(--text-light); }
  .t16 { background: #f59563; color: var(--text-light); }
  .t32 { background: #f67c5f; color: var(--text-light); }
  .t64 { background: #f65e3b; color: var(--text-light); }
  .t128 { background: #edcf72; color: var(--text-light); }
  .t256 { background: #edcc61; color: var(--text-light); }
  .t512 { background: #edc850; color: var(--text-light); }
  .t1024 { background: #edc53f; color: var(--text-light); }
  .t2048 { background: #edc22e; color: var(--text-light); }
  .t-super { background: #3c3a32; color: var(--text-light); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">2048</div>
      <div class="scores">
        <div class="score-box"><span class="label">分数</span><span class="val" id="score">0</span></div>
        <div class="score-box best"><span class="label">最高</span><span class="val" id="best">0</span></div>
      </div>
    </header>
    <div class="sub">
      <span class="hint">滑动屏幕移动方块，合并相同数字</span>
      <button class="btn" id="newGame">新游戏</button>
    </div>
    <div class="board-wrap">
      <div class="grid" id="grid"></div>
      <div class="overlay hidden" id="overlay">
        <div class="msg" id="overlayMsg">游戏结束</div>
        <div class="sub-msg" id="overlaySub"></div>
        <button class="btn" id="restartBtn">再来一局</button>
      </div>
    </div>
    <div class="sub" style="justify-content:center;opacity:.55;font-size:12px">
      电脑可用方向键 / WASD 操作
    </div>
  </div>

<script>
(function () {
  'use strict';
  const SIZE = 4, WIN = 2048, GAP = 12, ANIM_MS = 120;

  const gridEl = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlayMsg');
  const overlaySub = document.getElementById('overlaySub');
  const restartBtn = document.getElementById('restartBtn');

  let grid = [];       // 数值二维数组，0 表示空
  let tiles = [];      // 方块对象 {el, value, row, col}
  let score = 0, best = 0;
  let over = false, won = false, keepPlaying = false, animating = false;
  let moveTimer = null;

  try { best = parseInt(localStorage.getItem('best2048') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  for (let i = 0; i < SIZE * SIZE; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    gridEl.appendChild(c);
  }

  function cellSize() {
    const W = gridEl.clientWidth;
    return (W - (SIZE - 1) * GAP) / SIZE;
  }

  function placeTile(t) {
    const cs = cellSize();
    const x = t.col * (cs + GAP), y = t.row * (cs + GAP);
    t.el.style.width = t.el.style.height = cs + 'px';
    t.el.style.fontSize = fontSizeFor(t.value, cs) + 'px';
    t.el.style.setProperty('--tx', x + 'px');
    t.el.style.setProperty('--ty', y + 'px');
  }

  function layout() {
    // 兼容不支持 aspect-ratio 的老微信内核：显式把高度设为宽度
    const W = gridEl.clientWidth;
    gridEl.style.height = W + 'px';
    const cs = (W - (SIZE - 1) * GAP) / SIZE;
    gridEl.querySelectorAll('.cell').forEach((el, idx) => {
      const r = Math.floor(idx / SIZE), c = idx % SIZE;
      el.style.width = el.style.height = cs + 'px';
      el.style.transform = 'translate(' + (c * (cs + GAP)) + 'px,' + (r * (cs + GAP)) + 'px)';
    });
    tiles.forEach(placeTile);
  }

  function fontSizeFor(v, cs) {
    const d = String(v).length;
    if (d <= 2) return cs * 0.48;
    if (d === 3) return cs * 0.42;
    if (d === 4) return cs * 0.34;
    return cs * 0.28;
  }

  function tileClass(v) { return 't' + (v <= WIN ? v : 'super'); }

  function makeTile(row, col, value, isNew) {
    const el = document.createElement('div');
    el.className = 'tile ' + tileClass(value);
    el.textContent = value;
    const t = { el, value, row, col };
    gridEl.appendChild(el);
    if (isNew) el.classList.add('new');
    placeTile(t);
    return t;
  }

  function tileAt(r, c) {
    for (const t of tiles) if (t.row === r && t.col === c) return t;
    return null;
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empty.push([r, c]);
    if (!empty.length) return false;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    grid[r][c] = value;
    tiles.push(makeTile(r, c, value, true));
    return true;
  }

  function newGame() {
    clearTimeout(moveTimer);
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    gridEl.querySelectorAll('.tile').forEach(el => el.remove());
    tiles = [];
    score = 0; over = false; won = false; keepPlaying = false; animating = false;
    scoreEl.textContent = 0;
    overlay.classList.add('hidden');
    addRandomTile();
    addRandomTile();
  }

  function move(dir) {
    if (over || animating) return;
    const dirs = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
    const [dr, dc] = dirs[dir];
    const rows = dr === 1 ? [3, 2, 1, 0] : [0, 1, 2, 3];
    const cols = dc === 1 ? [3, 2, 1, 0] : [0, 1, 2, 3];
    const merged = new Set();
    const deadEls = [];      // 被合并后需要删除的方块 DOM
    const survivors = [];    // 合并后翻倍的方块（动画后恢复层级）
    let moved = false, gained = 0, reachedWin = false;

    for (const r of rows) {
      for (const c of cols) {
        const tile = tileAt(r, c);
        if (!tile) continue;
        let nr = r, nc = c;
        while (true) {
          const tr = nr + dr, tc = nc + dc;
          if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
          const target = tileAt(tr, tc);
          if (!target) { nr = tr; nc = tc; }
          else if (target.value === tile.value && !merged.has(target) && !merged.has(tile)) {
            nr = tr; nc = tc; break;
          } else break;
        }
        const target = tileAt(nr, nc);
        const isMerge = target && target !== tile && target.value === tile.value;

        if (nr !== r || nc !== c || isMerge) moved = true;

        if (isMerge) {
          const newVal = target.value * 2;
          grid[r][c] = 0;
          grid[nr][nc] = newVal;
          target.value = newVal;
          target.el.textContent = newVal;
          target.el.className = 'tile ' + tileClass(newVal) + ' merged';
          target.el.style.zIndex = 10;
          placeTile(target);
          merged.add(target);
          survivors.push(target);
          gained += newVal;
          if (newVal === WIN) reachedWin = true;
          // 被吸收的方块滑向目标位置，动画结束后删除
          tile.row = nr; tile.col = nc;
          tile.el.style.zIndex = 5;
          placeTile(tile);
          deadEls.push(tile.el);
          tiles = tiles.filter(t => t !== tile);
        } else if (nr !== r || nc !== c) {
          grid[r][c] = 0;
          grid[nr][nc] = tile.value;
          tile.row = nr; tile.col = nc;
          placeTile(tile);
        }
      }
    }

    if (!moved) return;

    score += gained;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('best2048', String(best)); } catch (e) {}
    }

    animating = true;
    moveTimer = setTimeout(() => {
      deadEls.forEach(el => el.remove());
      survivors.forEach(t => { t.el.style.zIndex = 2; });
      addRandomTile();
      animating = false;
      if (reachedWin && !won) {
        won = true;
        keepPlaying = true;
        showOverlay('你赢了！', '已达到 2048，继续挑战更高分，或重新开始。', true);
      } else if (!canMove()) {
        over = true;
        showOverlay('游戏结束', '没有可以移动的方块了。', false);
      }
    }, ANIM_MS + 20);
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return true;
        if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return true;
        if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return true;
      }
    }
    return false;
  }

  function showOverlay(msg, sub, isWin) {
    overlayMsg.textContent = msg;
    overlaySub.textContent = sub;
    restartBtn.textContent = isWin ? '继续游戏' : '再来一局';
    overlay.classList.remove('hidden');
  }

  // —— 触屏滑动 ——
  let sx = 0, sy = 0;
  const board = document.querySelector('.board-wrap');
  board.addEventListener('touchstart', function (e) {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });
  board.addEventListener('touchmove', function (e) {
    e.preventDefault();
  }, { passive: false });
  board.addEventListener('touchend', function (e) {
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (Math.max(adx, ady) < 24) return;
    move(adx > ady ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  // 阻止微信下拉刷新
  document.addEventListener('touchmove', function (e) {
    if (e.target === board || board.contains(e.target)) e.preventDefault();
  }, { passive: false });

  // —— 键盘 ——
  const keyMap = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    A: 'left', D: 'right', W: 'up', S: 'down'
  };
  document.addEventListener('keydown', function (e) {
    const d = keyMap[e.key];
    if (d) { e.preventDefault(); move(d); }
  });

  // —— 按钮 ——
  document.getElementById('newGame').addEventListener('click', newGame);
  restartBtn.addEventListener('click', function () {
    if (keepPlaying) { overlay.classList.add('hidden'); keepPlaying = false; }
    else newGame();
  });

  // —— 布局 ——
  let resizeTimer = null;
  window.addEventListener('resize', function () {
    tiles.forEach(t => t.el.classList.add('no-anim'));
    layout();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => tiles.forEach(t => t.el.classList.remove('no-anim')), 50);
  });

  layout();
  newGame();
})();
</script>
</body>
</html>
